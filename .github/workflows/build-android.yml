# Taruh file ini di repo GitHub-mu pada path: .github/workflows/build-android.yml
# Taruh juga the-canves.zip di root repo (tanpa diekstrak). Setiap push zip ini akan di-build.
name: Build The Canves (Android APK)

on:
  workflow_dispatch:
  push:
    paths:
      - "the-canves.zip"
      - ".github/workflows/build-android.yml"

env:
  GODOT_VERSION: "4.3"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Ambil repo
        uses: actions/checkout@v4

      - name: Ekstrak the-canves.zip
        run: |
          set -e
          rm -rf game
          mkdir game
          unzip -q -o the-canves.zip -d game
          PROJECT_FILE=$(find game -name project.godot | head -n 1)
          test -n "$PROJECT_FILE"
          echo "PROJECT_DIR=$(dirname "$PROJECT_FILE")" >> "$GITHUB_ENV"

      - name: Pasang Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Siapkan Android SDK bawaan runner
        run: |
          set -e
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=${ANDROID_HOME}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> "$GITHUB_ENV"
          SDKM=$(ls "${ANDROID_HOME}"/cmdline-tools/*/bin/sdkmanager | head -n 1)
          echo "sdkmanager: ${SDKM}"
          yes | "${SDKM}" --licenses > /dev/null || true
          "${SDKM}" "platform-tools" "build-tools;34.0.0" "platforms;android-34" "cmdline-tools;latest"
          ls "${ANDROID_HOME}/cmdline-tools"

      - name: Pasang Godot dan export template
        run: |
          set -e
          V="${GODOT_VERSION}"
          BASE="https://github.com/godotengine/godot/releases/download/${V}-stable"
          wget -q "${BASE}/Godot_v${V}-stable_linux.x86_64.zip"
          wget -q "${BASE}/Godot_v${V}-stable_export_templates.tpz"
          unzip -q "Godot_v${V}-stable_linux.x86_64.zip"
          sudo mv "Godot_v${V}-stable_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          mkdir -p "$HOME/.local/share/godot/export_templates"
          unzip -q "Godot_v${V}-stable_export_templates.tpz" -d tpl
          mv tpl/templates "$HOME/.local/share/godot/export_templates/${V}.stable"

      - name: Siapkan keystore debug dan pengaturan Godot
        run: |
          set -e
          keytool -genkeypair -keystore "$HOME/debug.keystore" -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p "$HOME/.config/godot"
          for f in "editor_settings-4.tres" "editor_settings-${GODOT_VERSION}.tres"; do
            {
              echo '[gd_resource type="EditorSettings" format=3]'
              echo
              echo '[resource]'
              echo "export/android/android_sdk_path = \"${ANDROID_HOME}\""
              echo "export/android/java_sdk_path = \"${JAVA_HOME}\""
              echo "export/android/debug_keystore = \"${HOME}/debug.keystore\""
              echo 'export/android/debug_keystore_user = "androiddebugkey"'
              echo 'export/android/debug_keystore_pass = "android"'
            } > "$HOME/.config/godot/$f"
          done

      - name: Import dan export APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          godot --headless --path . --import || true
          godot --headless --path . --export-debug "Android" build/TheCanves.apk
          test -s build/TheCanves.apk
          ls -la build

      - name: Unggah APK
        uses: actions/upload-artifact@v4
        with:
          name: TheCanves-APK
          path: ${{ env.PROJECT_DIR }}/build/TheCanves.apk
